# ═══════════════════════════════════════════════════════════════════════
#   Tabibi — Configuration Netlify avec headers de sécurité OWASP
# ═══════════════════════════════════════════════════════════════════════

[build]
  publish = "."

# ────────────────────────────────────────────────────────────────────────
# HEADERS GLOBAUX (s'appliquent à tout, ensuite affinés par règle)
# ────────────────────────────────────────────────────────────────────────

# =====================================================================
# [SECURITE 2026-09-09] Chemins de code source : 404 FORCE sur Netlify.
# _redirects contient deja `/supabase/* /404.html 404`, mais Netlify ignore une
# regle quand le fichier cible EXISTE, sauf `force = true`. Constate sur le
# preview de la PR #56 : /v2/src/App.tsx et /supabase/functions/send-sms/index.ts
# repondaient 200. Cloudflare, lui, est couvert par functions/*/[[path]].js.
# Ce bloc n'affecte que Netlify (previews de PR et staging).
# =====================================================================
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

