<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="description" content="Reinitialisez votre mot de passe Tabibi en quelques secondes.">
<link rel="canonical" href="https://tabibi.doctor/forgot-password.html">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F7560">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-192.png">
<title>Mot de passe oublié | Tabibi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/auth.css">
<link rel="stylesheet" href="styles/auth-page.css">
<style>
  .auth-wrap { width:100%; max-width:480px; margin:auto; padding:32px 24px; background:#fff; border-radius:16px; box-shadow:0 8px 32px rgba(0,0,0,.06); }
  .auth-hd { text-align:center; margin-bottom:24px; }
  .auth-hd i { font-size:36px; color:var(--blue); margin-bottom:12px; }
  .auth-hd h1 { font-size:22px; font-weight:800; margin:0 0 6px; color:var(--text); }
  .auth-hd p { font-size:13px; color:var(--text3); margin:0; }
  .btn-back { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text3); text-decoration:none; margin-bottom:16px; }
  .msg-ok { background:#dcfce7; color:#166534; padding:12px 14px; border-radius:10px; font-size:13px; margin-top:14px; display:none; }
  .msg-err { background:#fee2e2; color:#991b1b; padding:12px 14px; border-radius:10px; font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
<div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999"></div>

<div class="app-root">
<header class="app-bar" role="banner">
  <a href="index.html" class="app-bar-back" aria-label="Retour à l'accueil"><i class="fa fa-arrow-left" aria-hidden="true"></i></a>
  <svg class="logo-svg" width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tabibi"><defs><mask id="tbCrossHdr"><rect width="48" height="48" fill="#fff"/><path d="M21 10h6v11h11v6h-11v11h-6v-11h-11v-6h11z" fill="#000"/></mask></defs><rect x="2" y="2" width="44" height="44" rx="12" fill="var(--logo-bg,#0F7560)" mask="url(#tbCrossHdr)"/><path d="M5 24h8l3-8 4 16 4-12 3 4h13" fill="none" stroke="var(--logo-accent,#D4A437)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="app-bar-body">
    <div class="app-bar-title">Tabibi <span style="color:var(--green)"><span style="font-weight:800;letter-spacing:-.5px"><span style="color:#2E8B57">D</span><span style="color:#D21010">Z</span></span></span><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-1px;margin-left:5px"><path d="M14.8 3.5a8.5 8.5 0 1 0 0 17 6.8 6.8 0 1 1 0-17z" fill="#D21010"/><path d="M18.4 8.2l1.05 2.13 2.35.34-1.7 1.66.4 2.34-2.1-1.1-2.1 1.1.4-2.34-1.7-1.66 2.35-.34z" fill="#D21010"/></svg></div>
    <div class="app-bar-sub" style="font-family:'Cairo',sans-serif" data-i18n="auth_header_sub">طبيبي · Médecins Algérie</div>
  </div>
  <!-- [i18n] sélecteur de langue factorisé → js/tabibi-langbar.js -->
  <div data-langbar></div>
</header>
<main id="main" class="page" style="padding:0" role="main">
<section class="auth-hero">
<div class="auth-wrap">
  <a href="login.html" class="btn-back"><i class="fa fa-arrow-left"></i> <span data-i18n="back_login">Retour connexion</span></a>

  <div class="auth-hd">
    <i class="fa fa-key"></i>
    <h1 data-i18n="fp_title" class="h-page">Mot de passe oublié ?</h1>
    <p data-i18n="fp_subtitle">Saisissez votre email — nous vous enverrons un lien de réinitialisation.</p>
  </div>

  <form id="forgot-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="f_email" data-i18n="email_label">Email</label>
      <input
        class="form-control"
        id="f_email"
        type="email"
        autocomplete="email"
        required
        placeholder="vous@example.com"
        data-i18n-placeholder="email_ph">
    </div>

    <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn">
      <i class="fa fa-paper-plane"></i> <span data-i18n="send_btn">Envoyer le lien</span>
    </button>

    <div class="msg-ok" id="msg-ok" data-i18n="fp_msg_ok">
      Si un compte existe avec cet email, vous recevrez un lien dans quelques minutes. Pensez à vérifier vos spams.
    </div>
    <div class="msg-err" id="msg-err"></div>
  </form>

  <p style="text-align:center;font-size:12px;color:var(--text3);margin-top:20px">
    <span data-i18n="no_account">Pas encore de compte ?</span>
    <a href="signup.html" style="color:var(--blue);font-weight:600" data-i18n="signup_link">Inscription</a>
  </p>
</div>
</section>
</main>
</div>

<script>
function toastM(m,t){const c=document.getElementById("toast-container");if(!c)return;const col={success:"#2E8B57",error:"#D21010",info:"#0E5F46"};const d=document.createElement("div");d.style.cssText="background:"+(col[t]||col.info)+";color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.15);margin-bottom:8px";d.textContent=m;c.appendChild(d);setTimeout(()=>{d.parentNode&&d.parentNode.removeChild(d)},3500);}

document.getElementById('forgot-form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var emailEl = document.getElementById('f_email');
  var btn = document.getElementById('submit-btn');
  var okBox = document.getElementById('msg-ok');
  var errBox = document.getElementById('msg-err');
  okBox.style.display = 'none';
  errBox.style.display = 'none';

  var email = (emailEl.value || '').trim();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errBox.textContent = 'Email invalide.';
    errBox.style.display = 'block';
    return;
  }

  var sb = window.tabibi && window.tabibi.supabase;
  if (!sb) {
    errBox.textContent = 'Client non initialise. Rechargez la page.';
    errBox.style.display = 'block';
    return;
  }

  var origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Envoi...';

  var siteUrl = (window.TABIBI_CONFIG && window.TABIBI_CONFIG.SITE_URL) || window.location.origin;
  var redirectTo = siteUrl.replace(/\/$/, '') + '/reset-password.html';

  try {
    // [CRIT-5] token captcha frais — resetPasswordForEmail l'exige aussi une fois le captcha activé
    var captchaToken = window.tabibiTurnstile ? await window.tabibiTurnstile.getCaptchaToken() : undefined;
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectTo, captchaToken: captchaToken });
    // On affiche TOUJOURS le meme message (anti-enumeration)
    okBox.style.display = 'block';
    emailEl.value = '';
    if (r && r.error) {
      // Logger en silence, ne pas devoiler
      console.warn('[forgot] reset error', r.error);
    }
  } catch (e) {
    console.error('[forgot] exception', e);
    // Meme message generique pour ne pas devoiler l'existence du compte
    okBox.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.innerHTML = origHtml;
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/tabibi-turnstile.js"></script>
<script src="js/tabibi-bridge.js"></script>
<script src="js/tabibi-cookies.js"></script>
<script src="js/tabibi-lang.js"></script>
<script src="js/tabibi-i18n.js"></script>
<!-- [i18n] sélecteur de langue + synchro bouton actif factorisés -->
<script src="js/tabibi-langbar.js"></script>
<script src="js/tabibi-sentry.js"></script>
</body>
</html>
