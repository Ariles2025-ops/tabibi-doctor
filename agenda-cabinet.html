<style>
/* ═══ Agenda semaine (scoppé .ag-*) — Phase 3 lot 2 ═══════════════ */
.ag-toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.ag-week-label{ flex:1; text-align:center; font-weight:800; font-size:15px; color:var(--text); min-width:180px; }
.ag-demo{ background:#fffbeb; border:1px dashed #F59E0B; color:#92400e; font-weight:700; font-size:12px;
  padding:8px 12px; border-radius:10px; margin-bottom:10px; text-align:center; }
.ag-statusline{ min-height:18px; font-size:12px; color:var(--text3); margin-bottom:6px; text-align:center; }
.ag-wrap{ overflow:auto; border:1px solid var(--border,#e2e8f0); border-radius:14px; background:#fff;
  max-height:calc(100dvh - 250px); box-shadow:var(--s1, 0 1px 3px rgba(0,0,0,.06)); }
.ag-grid{ display:grid; grid-template-columns:56px repeat(7, minmax(120px,1fr)); min-width:920px; }
.ag-corner{ position:sticky; top:0; z-index:3; background:#fff; border-bottom:1.5px solid var(--border,#e2e8f0); }
.ag-dayhead{ position:sticky; top:0; z-index:3; background:#fff; text-align:center; font-weight:800; font-size:13px;
  padding:10px 4px; border-bottom:1.5px solid var(--border,#e2e8f0); border-inline-start:1px solid var(--border,#eef2f7); color:var(--text2); }
.ag-dayhead.today{ color:var(--brand-green-700,#0E5F46); background:var(--brand-green-50,#f0fdf4); }
.ag-hours{ position:relative; }
.ag-hlabel{ position:absolute; inset-inline-end:6px; transform:translateY(-50%); font-size:10px; font-weight:700; color:var(--text3); }
.ag-daycol{ position:relative; border-inline-start:1px solid var(--border,#eef2f7); background:#fafbfc; }
.ag-daycol.today{ background:#f7fdf9; }
.ag-hline{ position:absolute; left:0; right:0; height:1px; background:var(--border,#eef2f7); }
.ag-work{ position:absolute; left:0; right:0; background:rgba(15,117,96,.07); border-block:1px solid rgba(15,117,96,.12); }
.ag-block{ position:absolute; left:2px; right:2px; z-index:1; border-radius:8px; overflow:hidden;
  background:repeating-linear-gradient(45deg, rgba(148,163,184,.18) 0 6px, rgba(148,163,184,.34) 6px 12px);
  border:1px dashed #94a3b8; display:flex; align-items:flex-start; }
.ag-block span{ font-size:10px; font-weight:700; color:#475569; padding:3px 6px; background:rgba(255,255,255,.7); border-radius:0 0 8px 0; }
.ag-appt{ position:absolute; z-index:2; text-align:start; border:none; cursor:pointer; border-radius:8px;
  padding:2px 6px; font-size:11px; line-height:1.25; overflow:hidden; font-family:inherit;
  border-inline-start:3px solid transparent; box-shadow:0 1px 2px rgba(0,0,0,.08); transition:filter .12s; }
.ag-appt:hover{ filter:brightness(.96); }
.ag-appt .ag-appt-t{ font-weight:800; }
.ag-appt .ag-appt-n{ font-weight:600; }
.ag-appt.pending  { background:#fffbeb; border-inline-start-color:#F59E0B; color:#92400e; }
.ag-appt.confirmed{ background:#e7f3ef; border-inline-start-color:#0F7560; color:#0a4d3e; }
.ag-appt.cancelled{ background:#fff0f0; border-inline-start-color:#D21010; color:#991b1b; opacity:.55; text-decoration:line-through; }
.ag-appt.completed{ background:#e0e7ff; border-inline-start-color:#3730a3; color:#3730a3; }
.ag-appt.sel{ outline:2px solid var(--gold,#d4a437); outline-offset:1px; z-index:4; }
.ag-now{ position:absolute; left:0; right:0; height:2px; background:#D21010; z-index:3; box-shadow:0 0 4px rgba(210,16,16,.5); }
.ag-detail{ position:sticky; bottom:8px; margin-top:10px; background:#fff; border:1px solid var(--border,#e2e8f0);
  border-radius:14px; padding:12px 14px; box-shadow:0 8px 24px rgba(0,0,0,.12); display:flex; gap:12px;
  align-items:center; justify-content:space-between; flex-wrap:wrap; z-index:5; }
.ag-d-main{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:13px; }
.ag-d-reason{ color:var(--text2); }
.ag-d-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.ag-legend{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11px; color:var(--text3); justify-content:center; }
.ag-legend .lg{ display:inline-flex; align-items:center; gap:5px; }
.ag-legend .sw{ width:12px; height:12px; border-radius:4px; display:inline-block; }
.status-pill { display:inline-block; padding:2px 8px; border-radius:6px; font-size:10px; font-weight:700; text-transform:uppercase; }
.status-pill.pending   { background:#fef3c7; color:#92400e; }
.status-pill.confirmed { background:#e7f3ef; color:#0a4d3e; }
.status-pill.cancelled { background:#fff0f0; color:#991b1b; }
.status-pill.completed { background:#e0e7ff; color:#3730a3; }
@keyframes bell-ring{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-12deg)}20%,40%{transform:rotate(12deg)}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>
<script>(function(){var k=function(){var s=document.getElementById("splash");if(s)s.remove();var l=document.getElementById("loading");if(l)l.classList.add("hidden");};k();document.addEventListener("DOMContentLoaded",k);})();</script>
<div class="app-root">

<!-- [Phase 3] Header shell (variante app + slots) -->
<div data-tabibi-header data-variant="app" data-home="doctor-dashboard.html">
  <span data-slot="sub"><span data-i18n="ag_title">Agenda cabinet</span> · <span id="ag-ctx-sub">--</span> · طبيبي</span>
  <div data-slot="actions">
    <div data-langbar style="flex-shrink:0"></div>
    <button onclick="tabibiAgenda.logout()" class="btn btn-icon btn-ghost" style="color:#D21010" title="Déconnexion" aria-label="Se déconnecter"><i class="fa fa-right-from-bracket"></i></button>
  </div>
</div>
<script src="js/tabibi-header.js"></script>

<main id="main" class="page" role="main" style="padding:14px;max-width:1400px;margin:0 auto">
  <div class="ag-toolbar">
    <button onclick="tabibiAgenda.navWeek(-1)" class="btn btn-icon btn-ghost" aria-label="Semaine précédente"><i class="fa fa-chevron-left"></i></button>
    <button onclick="tabibiAgenda.goToday()" class="btn btn-ghost" style="font-weight:700" data-i18n="ag_today">Aujourd'hui</button>
    <button onclick="tabibiAgenda.navWeek(1)" class="btn btn-icon btn-ghost" aria-label="Semaine suivante"><i class="fa fa-chevron-right"></i></button>
    <div id="ag-week-label" class="ag-week-label">--</div>
    <select id="ag-doctor-filter" class="form-control" style="display:none;max-width:220px" onchange="tabibiAgenda.setDoctor(this.value)"></select>
  </div>

  <div id="ag-demo-banner" class="ag-demo" style="display:none"></div>
  <div id="ag-status" class="ag-statusline"></div>

  <div class="ag-wrap"><div class="ag-grid" id="ag-grid" role="grid" aria-label="Agenda semaine"></div></div>

  <div id="ag-detail" class="ag-detail" hidden></div>

  <div class="ag-legend">
    <span class="lg"><span class="sw" style="background:#e7f3ef;border-inline-start:3px solid #0F7560"></span> <span data-i18n="ag_status_confirmed">Confirmé</span></span>
    <span class="lg"><span class="sw" style="background:#fffbeb;border-inline-start:3px solid #F59E0B"></span> <span data-i18n="ag_status_pending">En attente</span></span>
    <span class="lg"><span class="sw" style="background:#fff0f0;border-inline-start:3px solid #D21010"></span> <span data-i18n="ag_status_cancelled">Annulé</span></span>
    <span class="lg"><span class="sw" style="background:#e0e7ff;border-inline-start:3px solid #3730a3"></span> <span data-i18n="ag_status_completed">Terminé</span></span>
    <span class="lg"><span class="sw" style="background:repeating-linear-gradient(45deg, rgba(148,163,184,.18) 0 4px, rgba(148,163,184,.34) 4px 8px);border:1px dashed #94a3b8"></span> <span data-i18n="ag_unavailable">Indisponible</span></span>
    <span class="lg"><span class="sw" style="background:rgba(15,117,96,.12)"></span> <span data-i18n="ag_work">Horaires d'ouverture</span></span>
  </div>
</main>
</div>

<script src="js/tabibi-sentry.js"></script>
</body>
</html>
