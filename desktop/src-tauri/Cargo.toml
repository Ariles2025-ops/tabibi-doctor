[package]
name = "tabibi-desktop"
version = "0.1.0"
description = "Tabibi Pro — logiciel cabinet pour médecins (Algérie)"
authors = ["Tabibi.doctor"]
edition = "2021"

# Frontend statique existant (HTML/CSS/JS vanilla) chargé depuis ../dist —
# aucun bundler, aucune logique métier côté Rust pour le MVP Phase 3.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
