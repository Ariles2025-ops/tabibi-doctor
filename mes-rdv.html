<style>
  .rdv-tabs { display:flex;border-bottom:2px solid var(--border);background:#fff;position:sticky;top:0;z-index:5; }
  .rdv-tab { flex:1;padding:14px 8px;text-align:center;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;background:transparent;border-left:0;border-right:0;border-top:0; }
  .rdv-tab.active { color:var(--blue);border-bottom-color:var(--blue); }
  .rdv-tab .count { display:inline-block;background:var(--bg2);color:var(--text3);font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--rfull);margin-left:6px;min-width:18px; }
  .rdv-tab.active .count { background:var(--blue-l);color:var(--blue); }
  .rdv-card { background:#fff;border-radius:var(--r12);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px;align-items:flex-start; }
  .rdv-card .ava { width:48px;height:48px;border-radius:var(--r12);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;background:#EEF4FB;color:#1557A0; }
  .rdv-card .body { flex:1;min-width:0; }
  .rdv-card .docname { font-size:14px;font-weight:700;color:var(--text1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
  .rdv-card .spec { font-size:12px;color:var(--text3);margin-bottom:6px; }
  .rdv-card .meta { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px; }
  .rdv-card .badge-sm { font-size:11px;padding:3px 8px;border-radius:var(--rfull);font-weight:600;background:var(--blue-l);color:var(--blue); }
  .rdv-card .badge-sm.is-cabinet { background:#FFF7E6;color:#B07000; }
  .rdv-card .badge-sm.is-visio { background:#EEF4FB;color:#1557A0; }
  .rdv-card .badge-sm.is-status-cancelled { background:#FFEEEC;color:var(--red); }
  .rdv-card .badge-sm.is-status-completed { background:var(--green-l);color:var(--green-d); }
  .rdv-card .badge-sm.is-status-pending { background:#FFF7E6;color:#B07000; }
  .rdv-card .reason { font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.4; }
  .rdv-card .actions { display:flex;gap:8px;flex-wrap:wrap; }
  .rdv-card .btn-cancel { font-size:12px;padding:6px 10px;background:transparent;border:1px solid var(--red);color:var(--red);border-radius:var(--r8);cursor:pointer;font-weight:600; }
  .rdv-card .btn-cancel:hover:not(:disabled) { background:#FFEEEC; }
  .rdv-card .btn-cancel:disabled { opacity:.4;cursor:not-allowed; }
  .rdv-card .btn-msg { font-size:12px;padding:6px 10px;background:var(--green-l);border:1px solid var(--green);color:var(--green-d);border-radius:var(--r8);cursor:pointer;font-weight:600; }
  .rdv-card .btn-msg:hover:not(:disabled) { background:#f0fdf4; }
  .rdv-card .btn-msg:disabled { opacity:.5;cursor:default; }
  /* [UX 2026-07-09] Modal annulation — remplace le confirm() natif (bloquant,
     hors design system). Même langage que les modals espace patient/médecin :
     feuille ivoire, arrondis, pastille sable, CTA "garder" primaire émeraude,
     action destructive SECONDAIRE sobre. Bottom-sheet mobile, centré desktop. */
  /* [A11Y 15/09/2026] `visibility:hidden` quand la modale est fermee.
     `opacity:0` + `pointer-events:none` la rendait invisible A LA SOURIS, mais
     ses boutons restaient DANS L'ORDRE DE TABULATION : un utilisateur au
     clavier entrait dans une boite de dialogue qu'il ne voyait pas, et dont il
     ne pouvait pas sortir du regard. axe le signalait comme
     `aria-hidden-focus` — un element `aria-hidden` ne doit contenir aucun
     element focusable, sinon le lecteur d'ecran et le clavier se contredisent.
     `visibility` retire les descendants du parcours clavier, et se transitionne
     comme l'opacite : le fondu est conserve. */
  .cxl-back { position:fixed;inset:0;background:rgba(5,39,29,.45);backdrop-filter:blur(4px);
    z-index:1200;display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s, visibility .2s; }
  .cxl-back.open { opacity:1;visibility:visible;pointer-events:auto; }
  .cxl-card { background:var(--bg,#FBF9F4);border:1px solid var(--border);
    border-radius:24px 24px 0 0;width:100%;max-width:420px;
    padding:26px 22px calc(20px + env(safe-area-inset-bottom));text-align:center;
    box-shadow:0 -16px 40px rgba(5,39,29,.18); }
  @media (prefers-reduced-motion:no-preference){
    .cxl-card { transform:translateY(18px);transition:transform .22s ease; }
    .cxl-back.open .cxl-card { transform:none; }
  }
  @media (min-width:640px){
    .cxl-back { align-items:center;padding:20px; }
    .cxl-card { border-radius:24px;padding-bottom:24px;box-shadow:0 24px 60px rgba(5,39,29,.22); }
  }
  .cxl-ico { width:56px;height:56px;border-radius:50%;background:var(--bg2,#F4EEE2);
    color:#B07000;display:flex;align-items:center;justify-content:center;
    font-size:22px;margin:0 auto 14px; }
  .cxl-title { font-size:17px;font-weight:800;margin-bottom:6px; }
  .cxl-body { font-size:13.5px;color:var(--text3);line-height:1.5;margin-bottom:18px; }

  .cxl-keep:hover { background:var(--blue-d,#0E5F46); }
  .cxl-confirm { display:block;width:100%;padding:12px;border:1px solid var(--border);

  .cxl-confirm:hover { background:#FFF5F4;border-color:#F3D9D5; }
  .rdv-empty { text-align:center;padding:48px 16px;color:var(--text3); }
  .rdv-empty .ico { font-size:48px;color:var(--text3);opacity:.4;margin-bottom:14px; }

  .rdv-empty .sub { font-size:13px;margin-bottom:18px; }
  .rdv-section { padding:14px 16px 60px; }
  .rdv-section.hidden { display:none; }
  .rdv-msg { padding:14px;text-align:center;color:var(--text3);font-size:13px;background:var(--bg2);border-radius:var(--r8);margin-bottom:10px; }
  .rdv-msg.is-error { background:#FFEEEC;color:var(--red); }
  .rdv-skeleton { background:#fff;border-radius:var(--r12);padding:14px;margin-bottom:10px;display:flex;gap:12px;animation:pulse 1.2s ease-in-out infinite; }
  .rdv-skeleton .sk-ava { width:48px;height:48px;border-radius:var(--r12);background:var(--bg2);flex-shrink:0; }
  .rdv-skeleton .sk-lines { flex:1;display:flex;flex-direction:column;gap:6px; }

  .rdv-skeleton .sk-line.xs { width:40%; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
</style>

<script>
// ========================================================================
// [Phase 5.2.4] mes-rdv.html — liste RDV patient + annulation
// ------------------------------------------------------------------------
// Dépend de :
//   • window.tabibiBooking.listMyAppointments() (Phase 5.2.1)
//   • window.tabibiBooking.cancelMyAppointment(id, reason)
//   • window.tabibiBooking.errorMessage(code)
//   • window.tabibiDoctorName.format(profile) (Phase 5.2.3-fix)
//
// Codes erreur spécifiques à cette page :
//   ERR_MESRDV_TOO_LATE_TO_CANCEL  — tentative d'annulation <24h avant
//
// (Les autres codes ERR_* viennent de tabibiBooking.)
// ========================================================================

var MESRDV_CODES = Object.freeze({
  ERR_MESRDV_TOO_LATE_TO_CANCEL: 'ERR_MESRDV_TOO_LATE_TO_CANCEL'
});
// [CONFORMITE 2026] i18n via dico PARTAGÉ (clés rdv_* dans js/tabibi-i18n.js).
// Statique = data-i18n (engine) ; dynamique (cartes, statuts, dates, toasts)
// = tabibiT + re-render sur tabibi:lang-change.
function _t(k, f){ return (typeof tabibiT === 'function') ? tabibiT(k, f) : f; }

function mesrdvMessage(code){
  if(code === MESRDV_CODES.ERR_MESRDV_TOO_LATE_TO_CANCEL){
    return _t('rdv_too_late', "Annulation impossible moins de 24h avant le RDV. Contactez le cabinet.");
  }
  if(window.tabibiBooking && window.tabibiBooking.errorMessage){
    return window.tabibiBooking.errorMessage(code);
  }
  return _t('rdv_unexpected', "Erreur inattendue.");
}

// ── State ───────────────────────────────────────────────────────────────
var _allAppointments = [];   // raw rows du backend
var _groups = { upcoming: [], past: [], cancelled: [] };
var _currentTab = 'upcoming';
var _cancelInFlight = false;

// ── TZ + formats ────────────────────────────────────────────────────────
// [CONFORMITE 2026] locale d'affichage par langue (ar-DZ = chiffres latins,
// cohérent reservation.html) ; formatters recréés à chaque appel (bascule live).
function _dateLocale(){
  var l = 'fr';
  try { l = (window.tabibiLang && window.tabibiLang.get()) || localStorage.getItem('tabibi_lang') || 'fr'; } catch(e){}
  return l === 'ar' ? 'ar-DZ-u-nu-latn' : (l === 'en' ? 'en-GB' : 'fr-FR');
}
function _formatDate(iso){
  if(!iso) return '—';
  try { return new Intl.DateTimeFormat(_dateLocale(), {
    weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:'Africa/Algiers'
  }).format(new Date(iso)); }
  catch(e) { return '—'; }
}
function _formatTime(iso){
  if(!iso) return '—';
  try { return new Intl.DateTimeFormat(_dateLocale(), {
    hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Africa/Algiers'
  }).format(new Date(iso)); }
  catch(e) { return '—'; }
}
function _formatDateTime(iso){
  return _formatDate(iso) + ' · ' + _formatTime(iso);
}

// ── Doctor name fallback (utilise tabibiDoctorName si dispo) ────────────
function _doctorName(row){
  // Cherche les champs nom standardisés (la vue my_upcoming_appointments
  // peut exposer doctor_full_name, doctor_name, ou imbriqué).
  // [FIX 2026-07-04] Schéma vue confirmé (sonde prod) : la colonne réelle est
  // `doctor_name` — non lue jusqu'ici → carte affichait "Praticien / ?".
  var profile = {
    full_name:     row.doctor_full_name    || row.doctor_name  || row.full_name    || (row.doctor && row.doctor.full_name)    || null,
    full_name_ar:  row.doctor_full_name_ar || row.full_name_ar || (row.doctor && row.doctor.full_name_ar) || null,
    entity_type:   row.doctor_entity_type  || row.entity_type  || (row.doctor && row.doctor.entity_type)  || null
  };
  if(window.tabibiDoctorName){
    return window.tabibiDoctorName.format(profile);
  }
  return profile.full_name || profile.full_name_ar || "Praticien";
}
function _doctorInitials(row){
  if(window.tabibiDoctorName){
    return window.tabibiDoctorName.initials({
      full_name:    row.doctor_full_name    || row.doctor_name  || row.full_name    || null,  // [FIX 2026-07-04] + doctor_name
      full_name_ar: row.doctor_full_name_ar || row.full_name_ar || null
    });
  }
  return '?';
}
function _doctorSpec(row){
  return row.doctor_specialty_fr || row.specialty_fr
       || (row.doctor && (row.doctor.specialty_fr || row.doctor.specialty_name_fr))
       || '';
}
function _consultLocation(row){
  // Détecte téléconsultation vs cabinet — heuristique sur consult_type / cabinet
  var ctype = (row.consult_type || '').toLowerCase();
  if(ctype.indexOf('visio') !== -1 || ctype.indexOf('tele') !== -1){
    return { kind: 'visio', label: _t('badge_teleconsult', 'Téléconsultation') };
  }
  var addr = row.cabinet_address || (row.cabinet && row.cabinet.address) || '';
  if(addr) return { kind: 'cabinet', label: addr };
  var ville = row.cabinet_city || row.wilaya_fr || (row.cabinet && row.cabinet.city) || '';
  if(ville) return { kind: 'cabinet', label: ville };
  return { kind: 'cabinet', label: _t('rdv_cabinet', 'Cabinet') };
}

// ── Group appointments en 3 buckets ─────────────────────────────────────
function _groupAppointments(rows){
  var now = Date.now();
  var groups = { upcoming: [], past: [], cancelled: [] };
  (rows || []).forEach(function(r){
    var status = String(r.status || '').toLowerCase();
    var when = r.starts_at || r.scheduled_at;
    var whenMs = when ? new Date(when).getTime() : 0;
    var d = window.tabibiStatutRdv.decrire(status);
    if(d.cle === 'cancelled'){
      groups.cancelled.push(r);
    } else if(d.cle === 'completed' || d.cle === 'no_show'){
      groups.past.push(r);
    } else if(!d.connu){
      // Un statut inconnu n'est PAS « a venir » : on ne promet rien.
      groups.past.push(r);
    } else if(whenMs && whenMs < now){
      groups.past.push(r);
    } else {
      groups.upcoming.push(r);
    }
  });
  // Tri : à venir = chronologique ASC, passés/annulés = DESC
  groups.upcoming.sort(function(a,b){
    return new Date(a.starts_at || a.scheduled_at) - new Date(b.starts_at || b.scheduled_at);
  });
  groups.past.sort(function(a,b){
    return new Date(b.starts_at || b.scheduled_at) - new Date(a.starts_at || a.scheduled_at);
  });
  groups.cancelled.sort(function(a,b){
    var ta = new Date(a.cancelled_at || a.starts_at || a.scheduled_at);
    var tb = new Date(b.cancelled_at || b.starts_at || b.scheduled_at);
    return tb - ta;
  });
  return groups;
}

// ── Can cancel (>24h avant) ─────────────────────────────────────────────
function _canCancel(row){
  var status = String(row.status || '').toLowerCase();
  if(!window.tabibiStatutRdv.decrire(status).peut('annuler')) return false;
  var when = row.starts_at || row.scheduled_at;
  if(!when) return false;
  var ms = new Date(when).getTime() - Date.now();
  return ms > 24 * 3600 * 1000;
}

// ── Render ──────────────────────────────────────────────────────────────
function _renderCard(row, opts){
  opts = opts || {};
  var status = String(row.status || '').toLowerCase();
  var name = _doctorName(row);
  var ini  = _doctorInitials(row);
  var spec = _doctorSpec(row);
  var loc  = _consultLocation(row);
  var when = row.starts_at || row.scheduled_at;
  var canCancel = _canCancel(row);
  // [13/09/2026] La chaine if/else n'avait pas de else : un statut inconnu
  // sortait SANS badge, exactement comme un confirme. Source unique desormais.
  var _d = window.tabibiStatutRdv.decrire(status);
  var statusBadge = '<span class="badge-sm ' + _d.classe + '">' + _escapeHtml(_d.libelle) + '</span>';

  var locBadge = '<span class="badge-sm is-' + loc.kind + '">'
               + '<i class="fa fa-' + (loc.kind === 'visio' ? 'video' : 'location-dot') + '"></i> '
               + _escapeHtml(loc.label) + '</span>';

  var dateBadge = '<span class="badge-sm"><i class="fa fa-calendar-day"></i> '
                + _escapeHtml(_formatDateTime(when)) + '</span>';

  var reasonHtml = '';
  if(row.reason){
    reasonHtml = '<div class="reason">' + _escapeHtml(row.reason) + '</div>';
  }
  if(status === 'cancelled' && row.cancellation_reason){
    reasonHtml += '<div class="reason"><em>' + _escapeHtml(_t('rdv_cancel_reason_label', 'Motif annulation :')) + ' ' + _escapeHtml(row.cancellation_reason) + '</em></div>';
  }

  // Bouton "Annuler" (RDV a venir) — inchange.
  var cancelBtn = '';
  if(opts.section === 'upcoming'){
    var disabledAttr = canCancel ? '' : 'disabled';
    var title = canCancel ? _t('rdv_cancel_title', 'Annuler ce RDV') : _t('rdv_cancel_too_late_title', 'Annulation impossible <24h avant le RDV');
    cancelBtn = '<button class="btn-cancel" '+disabledAttr+' title="' + _escapeAttr(title) + '" '
              + 'onclick="doCancel(\''+ _escapeAttr(row.id) +'\')">'
              + '<i class="fa fa-xmark"></i> ' + _escapeHtml(_t('rdv_cancel', 'Annuler')) + '</button>';
  }
  // [MSG] Bouton "Message" GATED : rendu UNIQUEMENT si features.messaging=true
  // (sinon ABSENT du DOM), et seulement sur un RDV confirme/honore avec doctor_id.
  var msgBtn = '';
  if((status === 'confirmed' || status === 'completed')
     && row.doctor_id
     && window.TABIBI_FEATURES && window.TABIBI_FEATURES.messaging){
    msgBtn = '<button class="btn-msg" onclick="openMessage(\''+ _escapeAttr(row.doctor_id) +'\', this)">'
           + '<i class="fa fa-comment-dots"></i> ' + _escapeHtml(_t('rdv_message', 'Message')) + '</button>';
  }
  var actionsHtml = (cancelBtn || msgBtn) ? ('<div class="actions">' + cancelBtn + msgBtn + '</div>') : '';

  return '<article class="rdv-card" data-id="'+_escapeAttr(row.id)+'">'
       + '<div class="ava">'+_escapeHtml(ini || '?')+'</div>'
       + '<div class="body">'
       +   '<div class="docname">'+_escapeHtml(name)+'</div>'
       +   (spec ? '<div class="spec">'+_escapeHtml(spec)+'</div>' : '')
       +   '<div class="meta">'+dateBadge+' '+locBadge+' '+statusBadge+'</div>'
       +   reasonHtml
       +   actionsHtml
       + '</div>'
       + '</article>';
}

function _renderEmpty(section){
  var msgMap = {
    upcoming:  { title:_t('rdv_empty_upcoming_title', "Aucun rendez-vous à venir"), sub:_t('rdv_empty_upcoming_sub', "Trouvez un médecin et réservez en quelques clics.") },
    past:      { title:_t('rdv_empty_past_title', "Aucun rendez-vous passé"),   sub:_t('rdv_empty_past_sub', "Votre historique apparaîtra ici après votre 1ère consultation.") },
    cancelled: { title:_t('rdv_empty_cancelled_title', "Aucun rendez-vous annulé"),  sub:_t('rdv_empty_cancelled_sub', "Vos annulations apparaîtront ici.") }
  };
  var m = msgMap[section] || msgMap.upcoming;
  return '<div class="rdv-empty">'
       + '<i class="fa fa-calendar-xmark ico"></i>'
       + '<div class="title">'+_escapeHtml(m.title)+'</div>'
       + '<div class="sub">'+_escapeHtml(m.sub)+'</div>'
       + '<a href="accueil-public.html#name-search" class="btn btn-primary btn-lg"><i class="fa fa-search"></i> '+_escapeHtml(_t('rdv_find_doctor', 'Trouver un médecin'))+'</a>'
       + '</div>';
}

// [MSG] Ouvre/cree la conversation avec le medecin de CE rdv (gating RDV cote RPC),
// puis redirige vers le fil. Erreur -> message propre, pas de crash ni spinner infini.
async function openMessage(doctorId, btn){
  if(!window.tabibiMessaging || !doctorId) return;
  if(btn) btn.disabled = true;
  try {
    var convId = await window.tabibiMessaging.ensureConversation(doctorId);
    if(convId){ window.location.href = 'conversation.html?c=' + encodeURIComponent(convId); return; }
    throw new Error('no_conv');
  } catch(e){
    if(btn) btn.disabled = false;
    alert(_t('rdv_msg_unavailable', 'Messagerie indisponible pour ce rendez-vous'));
  }
}
window.openMessage = openMessage;

function _renderSection(section){
  var list = _groups[section] || [];
  var html;
  if(list.length === 0){
    html = _renderEmpty(section);
  } else {
    html = list.map(function(r){ return _renderCard(r, { section: section }); }).join('');
  }
  document.getElementById('list-' + section).innerHTML = html;
  document.getElementById('count-' + section).textContent = list.length;
  // [FIX 2026-07-04] La source my_upcoming_appointments ne renvoie que l'à-venir :
  // "Passés"/"Annulés" resteraient à 0 en permanence (trompeur). On masque ces
  // deux onglets tant qu'ils sont vides — ils réapparaissent automatiquement si
  // une source tous-statuts est câblée un jour. "À venir" reste toujours visible.
  if(section === 'past' || section === 'cancelled'){
    var tabBtn = document.getElementById('tab-' + section);
    if(tabBtn) tabBtn.classList.toggle('hidden', list.length === 0);
  }
}

function _renderAll(){
  _renderSection('upcoming');
  _renderSection('past');
  _renderSection('cancelled');
}

function _renderSkeleton(){
  var sk = '<div class="rdv-skeleton"><div class="sk-ava"></div><div class="sk-lines">'
         + '<div class="sk-line"></div><div class="sk-line sm"></div><div class="sk-line xs"></div>'
         + '</div></div>';
  document.getElementById('list-upcoming').innerHTML = sk.repeat(3);
}

// ── Tabs ────────────────────────────────────────────────────────────────
function showTab(name){
  _currentTab = name;
  ['upcoming','past','cancelled'].forEach(function(s){
    var tab = document.getElementById('tab-' + s);
    var sec = document.getElementById('section-' + s);
    var isActive = (s === name);
    tab.classList.toggle('active', isActive);
    tab.setAttribute('aria-selected', isActive);
    sec.classList.toggle('hidden', !isActive);
  });
}

// ── Auth wall ───────────────────────────────────────────────────────────
function _showAuthWall(){
  document.getElementById('auth-wall').classList.remove('hidden');
  document.getElementById('global-error').classList.add('hidden');
  ['upcoming','past','cancelled'].forEach(function(s){
    document.getElementById('section-' + s).classList.add('hidden');
  });
  document.querySelector('.rdv-tabs').classList.add('hidden');
  var login = document.getElementById('auth-wall-login');
  if(login){
    var current = location.pathname + location.search;
    login.href = 'login.html?next=' + encodeURIComponent(current);
  }
}
function _showError(msg){
  document.getElementById('global-error-msg').textContent = msg;
  document.getElementById('global-error').classList.remove('hidden');
}
function _hideError(){
  document.getElementById('global-error').classList.add('hidden');
}

// [FIX 2026-07-03] toast() était un global de scripts/app.js (retiré Phase
// 16.5, scripts/ export-ignore au déploiement) → ReferenceError sur TOUS les
// chemins de doCancel : le RDV était bien annulé en base mais l'UI ne se
// rafraîchissait jamais (loadAppointments jamais atteint). Copie locale de
// l'implémentation canonique d'index.html (CSS .toast-wrap/.toast déjà dans
// styles/app.css). Guard typeof : ne redéfinit pas si un global revient.
if(typeof window.toast !== 'function'){
  window.toast = function(msg, type, ms){
    type = type || 'info'; ms = ms || 3500;
    var c = document.getElementById('toast-wrap');
    if(!c){ c = document.createElement('div'); c.id = 'toast-wrap'; c.className = 'toast-wrap'; document.body.appendChild(c); }
    var icons = { success:'fa-check-circle', error:'fa-circle-xmark', info:'fa-circle-info' };
    var t = document.createElement('div');
    t.className = 'toast toast-' + type; t.setAttribute('role', 'alert');
    // [XSS 15/09/2026] Troisieme page portant ce meme puits (apres `home-app.js`
    // — ou il etait atteignable — et `reservation.html`). L'icone se construit a
    // part, depuis la table interne ; le message est du TEXTE.
    var _ico = document.createElement('i');
    _ico.className = 'fa ' + (icons[type] || icons.info);
    _ico.setAttribute('aria-hidden', 'true');
    t.appendChild(_ico);
    t.appendChild(document.createTextNode(msg == null ? '' : String(msg)));
    c.appendChild(t);
    setTimeout(function(){
      t.style.transition = 'all .28s'; t.style.opacity = '0'; t.style.transform = 'translateY(-6px)';
      setTimeout(function(){ t.remove(); }, 300);
    }, ms);
  };
}

// ── Load + cancel ───────────────────────────────────────────────────────
async function loadAppointments(){
  _hideError();
  document.getElementById('auth-wall').classList.add('hidden');
  document.querySelector('.rdv-tabs').classList.remove('hidden');
  ['upcoming','past','cancelled'].forEach(function(s){
    document.getElementById('section-' + s).classList.toggle('hidden', s !== _currentTab);
  });
  _renderSkeleton();

  if(!window.tabibiBooking){
    _showError(_t('err_booking_module', 'Module de réservation indisponible. Rechargez la page.'));
    return;
  }

  var r = await window.tabibiBooking.listMyAppointments();

  if(!r.ok){
    if(r.error === 'ERR_AUTH_REQUIRED' || r.error === 'ERR_SESSION_EXPIRED'){
      _showAuthWall();
      return;
    }
    _showError(mesrdvMessage(r.error));
    return;
  }

  _allAppointments = r.data || [];
  _groups = _groupAppointments(_allAppointments);
  _renderAll();
}

// [UX 2026-07-09] confirm() natif → modal cxl-* (cohérent design system,
// non bloquant). doCancel garde les gardes puis ouvre le modal ; la
// confirmation déclenche _confirmCancelRdv() qui exécute l'annulation.
var _pendingCancelId = null;
function _openCancelModal(){
  var m = document.getElementById('cxl-modal');
  if(!m) return false;
  m.classList.add('open');
  m.setAttribute('aria-hidden', 'false');
  var keep = document.getElementById('cxl-keep');
  if(keep) keep.focus();
  return true;
}
function _closeCancelModal(){
  var m = document.getElementById('cxl-modal');
  if(!m) return;
  m.classList.remove('open');
  m.setAttribute('aria-hidden', 'true');
  _pendingCancelId = null;
}
document.addEventListener('DOMContentLoaded', function(){
  var m = document.getElementById('cxl-modal');
  if(!m) return;
  // Clic sur le voile (hors carte) = garder le RDV
  m.addEventListener('click', function(e){ if(e.target === m) _closeCancelModal(); });
  document.getElementById('cxl-keep').addEventListener('click', _closeCancelModal);
  document.getElementById('cxl-confirm').addEventListener('click', _confirmCancelRdv);
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && m.classList.contains('open')) _closeCancelModal();
  });
});

function doCancel(id){
  if(_cancelInFlight){
    toast(_t('rdv_cancel_inflight', "Annulation déjà en cours…"), "info");
    return;
  }
  // Re-check >24h client-side au moment du clic (au cas où l'utilisateur
  // serait resté longtemps sur la page).
  var row = _allAppointments.find(function(r){ return r.id === id; });
  if(row && !_canCancel(row)){
    toast(mesrdvMessage(MESRDV_CODES.ERR_MESRDV_TOO_LATE_TO_CANCEL), "warning");
    return;
  }
  _pendingCancelId = id;
  if(!_openCancelModal()){
    // Filet : si le modal manque au DOM, retomber sur confirm() natif
    if(confirm(_t('rdv_confirm_cancel', "Annuler ce rendez-vous ?\nVous pourrez en reprendre un nouveau si besoin."))) _confirmCancelRdv();
  }
}

async function _confirmCancelRdv(){
  var id = _pendingCancelId;
  _closeCancelModal();
  if(!id || _cancelInFlight) return;
  _cancelInFlight = true;
  var btn = document.querySelector('.rdv-card[data-id="'+id+'"] .btn-cancel');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> …'; }

  var r = await window.tabibiBooking.cancelMyAppointment(id, '');
  _cancelInFlight = false;

  if(r.ok){
    toast(_t('rdv_cancelled_ok', "Rendez-vous annulé."), "success");
    // Refresh complet pour récupérer le nouveau status + déplacer la card
    // de "À venir" vers "Annulés" proprement.
    loadAppointments();
    return;
  }
  if(r.error === 'ERR_AUTH_REQUIRED' || r.error === 'ERR_SESSION_EXPIRED'){
    _showAuthWall();
    return;
  }
  toast(mesrdvMessage(r.error), "error");
  if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa fa-xmark"></i> ' + _escapeHtml(_t('rdv_cancel', 'Annuler')); }
}

// ── Escape helpers (XSS-safe innerHTML) ────────────────────────────────
function _escapeHtml(s){
  if(s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function _escapeAttr(s){ return _escapeHtml(s); }

// ── Goback + init ───────────────────────────────────────────────────────
function goBackSafe(){
  if(document.referrer) history.back();
  else window.location.href = "accueil-public.html";
}

function init(){
  if(typeof loadUser === 'function') loadUser();
  if(typeof setLang === 'function') setLang(lang);
  if(typeof renderUserUI === 'function') renderUserUI();
  if(typeof initTabBar === 'function') initTabBar("rdv");
  if(typeof hideLoading === 'function') hideLoading();
  loadAppointments();
}
// [R1 2026-09-10] Garde centralisée : la page s'affichait sans session (onglets vides).
// requireAuth('patient') valide la session AVANT le cache et redirige vers login sinon.
async function initAvecGarde(){
  var authed = window.tabibi && window.tabibi.auth ? await window.tabibi.auth.requireAuth('patient') : null;
  if(!authed) return;
  init();
}

document.addEventListener("DOMContentLoaded", initAvecGarde);

// [CONFORMITE 2026] re-render des listes (statuts, dates, vides) au changement
// de langue — le statique est géré par l'engine. Pas pendant le chargement.
document.addEventListener('tabibi:lang-change', function(){
  try { if(!document.querySelector('.rdv-skeleton')) _renderAll(); } catch(e){}
});
window.showTab = showTab;
window.doCancel = doCancel;
window.goBackSafe = goBackSafe;
window.loadAppointments = loadAppointments;
</script>
