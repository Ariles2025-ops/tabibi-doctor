# =====================================================================
# verification.yml — ce qui doit passer avant qu'une PR soit mergeable
# =====================================================================
# Le depot n'avait AUCUNE verification automatique : un seul workflow, et il
# ne concernait que les installateurs desktop. Rien n'empechait une regression
# d'atteindre la production sur les parcours qui portent le produit.
#
# Ce workflow ne bloque pas sur le style. Il bloque sur trois choses :
#   1. le code doit se parser (no-undef, erreurs de syntaxe) ;
#   2. la dette mesuree ne doit pas AUGMENTER (scripts/compter-dette.mjs) ;
#   3. le site doit se construire.
#
# Il ne DEPLOIE rien. Le deploiement reste manuel et valide par un humain,
# conformement a CLAUDE.md. Un workflow de deploiement automatique est le
# chantier suivant : c'est lui qui retirera le risque « aucun correctif ne
# peut partir si personne n'est devant le Mac ».
# =====================================================================
name: verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Erreurs bloquantes uniquement
        # --quiet masque les warnings : seules les erreurs (no-undef, parsing)
        # font echouer cette etape. La dette est traitee a l'etape suivante.
        run: npx eslint js src scripts --quiet

      - name: La dette ne doit pas augmenter
        run: npm run lint:dette

      - name: Les trois dictionnaires ont les memes cles
        run: npm run i18n:verifier

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium

      - name: Parcours critiques (sources)
        # 30 tests sur 2 profils (Pixel 5 + Desktop Chrome) : accueil, inscription,
        # connexion, reservation, et disponibilite des pages vitales. Ils ne creent
        # AUCUNE donnee en base. ~7 s.
        run: npm run test:e2e

      - name: Le site doit se construire
        run: npm run build

      - name: Les memes parcours, sur la sortie de build
        # Le build peut casser ce que les sources font marcher : c'est arrive le
        # 09/09/2026 (SDK Supabase UMD bundle en ESM -> window.supabase perdu).
        # On rejoue donc la suite contre dist-web.
        run: npm run test:e2e:build

      - name: Rapport de test si echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Taille des bundles produits
        # Trace le poids a chaque PR : c'est la seule facon de voir une
        # regression de performance avant qu'elle n'atteigne les utilisateurs.
        run: |
          echo "### Bundles" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist-web >> $GITHUB_STEP_SUMMARY
          ls -lh dist-web/assets/build/*.js | awk '{print $5, $9}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------
  # v2 — l'application React. Chaine d'outils separee (Vite 8, Vitest 3),
  # donc job separe : un echec ici ne doit pas masquer l'etat du site v1,
  # qui est ce qui tourne en production aujourd'hui.
  # ---------------------------------------------------------------------
  verifier-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Typage strict
        # C'est cette etape qui a prouve, le 09/09/2026, que la v2 interrogeait
        # une colonne inexistante :
        #   TS2352: SelectQueryError<"column 'nom' does not exist on 'doctor_profiles'.">
        # Les types viennent du schema reel (supabase gen types), pas d'une
        # hypothese ecrite a la main.
        run: npm run typecheck

      - name: Tests des regles metier
        run: npm test

      - name: Build
        run: npm run build

