<style>
  /* [DAWINI] Styles inline (1 page) — mini-dashboard pattern secretaire. */
  .dwp-shell { padding: 14px 16px 80px; max-width: 720px; margin: 0 auto; }
  .dwp-kpis { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .dwp-kpi { background:#fff; border-radius: var(--r12); padding: 14px 10px; text-align:center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .dwp-kpi b { display:block; font-size: 22px; color: var(--blue); }
  .dwp-kpi span { font-size: 11px; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .dwp-req { background:#fff; border-radius: var(--r16); padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 12px; }
  .dwp-req .meds { font-weight: 800; font-size: 15px; }
  .dwp-req .meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .dwp-req .note { background: var(--bg2); border-radius: var(--r8); padding: 9px 11px; font-size: 12.5px; color: var(--text2); margin-top: 9px; }
  .dwp-img { margin-top: 10px; }
  .dwp-img img { max-width: 100%; max-height: 260px; border-radius: var(--r8); display: block; }
  .dwp-form { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
  .dwp-check { display:flex; align-items:center; gap: 9px; font-size: 13.5px; font-weight: 600; margin-bottom: 9px; }
  .dwp-actions { display:flex; gap: 10px; margin-top: 12px; }
  .dwp-actions .btn { flex: 1; justify-content: center; font-weight: 700; }
  .dwp-done { background: var(--bg2); border-radius: var(--r12); padding: 11px 13px; font-size: 12.5px; color: var(--text2); margin-top: 10px; }
  .dwp-done.acc { background:#e7f3ef; color: var(--green-d, #0E5F46); }
  .dwp-contact { background:#e7f3ef; border:1px solid #d4e9e1; border-radius: var(--r12); padding: 11px 13px; font-size: 13px; margin-top: 10px; }
  .dwp-empty { padding: 40px 16px; text-align:center; color: var(--text3); font-size: 13px; }
  .dwp-empty i { font-size: 40px; opacity:.35; display:block; margin-bottom: 10px; }
  .dwp-guard { padding: 60px 20px; text-align:center; }
  .dwp-guard i { font-size: 52px; color: var(--red); opacity:.5; margin-bottom: 16px; display:block; }
  .dwp-newdot { display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--red); margin-inline-start: 6px; animation: dwpulse 1.6s infinite; }
  @keyframes dwpulse { 0%,100%{opacity:.3} 50%{opacity:1} }

  /* ═══ [DAWINI 2026-07-08] SKIN v4 PREMIUM — aligné tabibi-landing-v4.html ═══
     Palette « Tabibi 2027 » : émeraude #0F7560 · ivoire #FBF9F4 · sable #F4EEE2
     · or #D4A437 · lignes #E7E0D2 · encre #0F2A24. Typo Plus Jakarta Sans (+ Cairo AR).
     Peau uniquement — aucune logique modifiée. */
  :root{
    --emerald:#0F7560; --emerald-d:#0E5F46; --ink:#0F2A24; --ivory:#FBF9F4;
    --sand:#F4EEE2; --v4line:#E7E0D2; --gold:#D4A437; --slate:#5C6B63;
    /* remap tokens app → v4 (boutons, liens, focus suivent automatiquement) */
    --blue:#0F7560; --blue-l:#E7F1EC; --border:#E7E0D2; --bg2:#F4EEE2;
    --text2:#43584F; --text3:#5C6B63; --green-d:#0E5F46;
  }
  body{ font-family:'Plus Jakarta Sans',system-ui,sans-serif; background:var(--ivory); color:var(--ink); -webkit-font-smoothing:antialiased; }
  html[lang="ar"] body, [dir="rtl"] body{ font-family:'Cairo','Plus Jakarta Sans',sans-serif; }
  .page{ background:var(--ivory); }
  .app-bar{ background:rgba(251,249,244,.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--v4line); }
  .app-bar-title{ font-weight:800; letter-spacing:-.5px; color:var(--ink); }
  .tab-bar{ background:rgba(251,249,244,.92); border-top:1px solid var(--v4line); }
  h2{ font-weight:800; letter-spacing:-.5px; color:var(--ink); }
  .btn{ border-radius:999px; font-weight:700; }
  .btn-primary{ background:var(--emerald); }
  .btn-primary:hover, .btn-primary:active{ background:var(--emerald-d); }
  .form-control{ border-radius:13px; border:1.5px solid var(--v4line); background:#fff; }
  .form-control:focus{ border-color:var(--emerald); box-shadow:0 0 0 3px rgba(15,117,96,.12); }
  .dwp-kpi{ background:#fff; border:1px solid var(--v4line); border-radius:18px; box-shadow:0 6px 18px rgba(16,40,34,.05); }
  .dwp-kpi b{ color:var(--emerald); font-weight:800; letter-spacing:-.3px; }
  .dwp-kpi span{ color:var(--slate); }
  .dwp-req{ border:1px solid var(--v4line); border-radius:24px; box-shadow:0 16px 40px rgba(5,39,29,.08); }
  .dwp-req .note{ background:var(--sand); border-radius:14px; }
  .dwp-form{ border-top:1px solid var(--v4line); }
  .dwp-done{ background:var(--sand); border-radius:14px; }
  .dwp-done.acc, .dwp-contact{ background:#E7F1EC; border-color:#D5E7DF; }
  .dwp-newdot{ background:var(--gold); }

  /* [DAWINI PREMIUM 2026-07-08] Format PC : shell large + KPIs généreux */
  @media (min-width:1024px){
    .page{ max-width:none; margin-inline:0; }  /* [V4D] layout desktop dédié */
    .dwp-shell{ max-width:1020px; padding-top:26px; }
    .dwp-kpis{ gap:16px; }
    .dwp-kpi{ padding:22px 12px; border-radius:20px; }
    .dwp-kpi b{ font-size:30px; }
    .dwp-kpi span{ font-size:12px; }
    .dwp-req{ padding:22px; }
  }

  /* ═══ [DW-UX 2026-07-09] Toasts premium + micro-interactions + états ═══ */
  #dw-toasts{ position:fixed; bottom:max(20px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:900; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; }
  .dw-toast{ display:flex; align-items:center; gap:8px; background:#0F2A24; color:#fff; border-radius:999px; padding:11px 18px; font-size:13px; font-weight:600; box-shadow:0 18px 40px rgba(2,30,22,.35); opacity:0; transform:translateY(8px); transition:opacity .22s, transform .22s; max-width:min(92vw, 480px); }
  .dw-toast.in{ opacity:1; transform:none; }
  .dw-toast.success i{ color:#7FE0BC; }
  .dw-toast.error{ background:#7C2D22; } .dw-toast.error i{ color:#FFC9BC; }
  .dw-toast.info i{ color:#F0CE74; }
  .dw-loading{ display:flex; align-items:center; justify-content:center; gap:9px; padding:26px; color:#5C6B63; font-size:13px; font-weight:600; }
  .dw-loading i{ color:#0F7560; }
  .dw-empty2{ text-align:center; padding:26px 16px 30px; }
  .dw-empty2 .ic{ width:52px; height:52px; border-radius:50%; background:#F4EEE2; color:#B49B62; display:flex; align-items:center; justify-content:center; font-size:20px; margin:0 auto 10px; }
  .dw-empty2 b{ display:block; font-size:14px; font-weight:800; color:#0F2A24; margin-bottom:3px; }
  .dw-empty2 p{ font-size:12.5px; color:#5C6B63; margin:0; max-width:44ch; margin-inline:auto; }
  .dw-empty2 a{ display:inline-block; margin-top:9px; font-size:12.5px; font-weight:700; color:#0E5F46; border-bottom:1px dashed #0F7560; cursor:pointer; text-decoration:none; }

  .dwp-req{ transition:transform .18s, box-shadow .18s; }
  @media (hover:hover){ .dwp-req:hover{ transform:translateY(-2px); box-shadow:0 20px 44px rgba(5,39,29,.10); } }
  .dwp-kpi{ transition:transform .15s, box-shadow .15s; }
  @media (hover:hover){ .dwp-kpi:hover{ transform:translateY(-2px); box-shadow:0 12px 26px rgba(16,40,34,.08); } }
  @media (prefers-reduced-motion:reduce){ .dwp-req,.dwp-kpi{ transition:none; } }
</style>

<script>
// ========================================================================
// [DAWINI 2026-07-08] dawini-pharmacie.html — interface pharmacie
// ------------------------------------------------------------------------
// • Garde : session + fiche pharmacies liée (user_id), sinon écran refus
//   (pattern secretaire-dashboard : session → rôle → toast/écran).
// • Réception : polling 20 s (décision fondateur, pas de Realtime v1) ;
//   les notifications in-app/push arrivent par la table notifications.
// • Fiche : image ordonnance (URL signée), médicaments, note.
// • Réponse : dispo / générique / médicaments précisés / commentaire,
//   puis Accepter ou Refuser (RPC dawini_respond, unicité serveur).
// • Contact patient : APRÈS acceptation uniquement (RPC 18-07).
// ========================================================================
function _t(k, f){ return (typeof tabibiT === 'function') ? tabibiT(k, f) : f; }
function _esc(s){ var d = document.createElement('div'); d.textContent = (s == null ? '' : String(s)); return d.innerHTML; }
function goBackSafe(){ if (history.length > 1) history.back(); else window.location = 'index.html'; }
function toastM(msg, kind){
  if (typeof window.toast === 'function') return window.toast(msg, kind);
  // [DW-UX 2026-07-09] toast premium — fini alert()
  var c = document.getElementById('dw-toasts');
  if (!c){ c = document.createElement('div'); c.id = 'dw-toasts'; c.setAttribute('aria-live','polite'); document.body.appendChild(c); }
  var t = document.createElement('div'); t.className = 'dw-toast ' + (kind || 'info');
  t.innerHTML = '<i class="fa ' + (kind === 'success' ? 'fa-circle-check' : kind === 'error' ? 'fa-circle-exclamation' : 'fa-circle-info') + '"></i> ' + _esc(msg);
  c.appendChild(t);
  setTimeout(function(){ t.classList.add('in'); }, 10);  // setTimeout (rAF gelé si onglet en arrière-plan)
  setTimeout(function(){ t.classList.remove('in'); setTimeout(function(){ t.remove(); }, 250); }, 2800);
}

var state = { pharmacy: null, poller: null, lastCount: 0, imgUrls: {} };

// ── Rendu d'une demande ──────────────────────────────────────────────────
function _reqCard(req){
  var when = '';
  try { when = (typeof tabibiFormatDate === 'function') ? tabibiFormatDate(req.created_at, {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : new Date(req.created_at).toLocaleString(); } catch(e){}
  var html = '<article class="dwp-req" data-id="' + _esc(req.id) + '">' +
    '<div class="meds"><i class="fa fa-pills" style="color:var(--blue)"></i> ' + _esc((req.medicaments || []).join(', ')) + '</div>' +
    '<div class="meta">' + _esc(when) + ' · ' + _esc(_t('dw_ph_wilaya','Wilaya')) + ' ' + String(req.wilaya_code).padStart(2,'0') + '</div>' +
    (req.note ? '<div class="note"><i class="fa fa-comment-dots"></i> ' + _esc(req.note) + '</div>' : '');

  // Image d'ordonnance : URL signée chargée à la demande (bouton)
  if (req.image_path){
    var cached = state.imgUrls[req.id];
    html += cached
      ? '<div class="dwp-img"><img src="' + _esc(cached) + '" alt="Ordonnance"></div>'
      : '<button class="btn btn-ghost" style="margin-top:9px;font-size:12.5px" onclick="showImage(\'' + req.id + '\',\'' + _esc(req.image_path) + '\')"><i class="fa fa-image"></i> ' + _esc(_t('dw_ph_view_img','Voir l\'ordonnance')) + '</button>';
  }

  if (req.my_response){
    var r = req.my_response;
    html += '<div class="dwp-done' + (r.status === 'accepted' ? ' acc' : '') + '">' +
      (r.status === 'accepted'
        ? '<i class="fa fa-check"></i> ' + _esc(_t('dw_ph_done_acc','Acceptée')) + (r.generique ? ' · ' + _esc(_t('dw_ph_generic','Générique')) : '')
        : '<i class="fa fa-xmark"></i> ' + _esc(_t('dw_ph_done_ref','Refusée'))) +
      (r.commentaire ? ' — ' + _esc(r.commentaire) : '') +
      '</div>';
    if (r.status === 'accepted'){
      html += '<div class="dwp-contact" id="contact-' + _esc(req.id) + '">' +
        '<button class="btn btn-ghost" style="font-size:12.5px" onclick="showContact(\'' + req.id + '\')"><i class="fa fa-address-card"></i> ' + _esc(_t('dw_ph_contact','Voir les coordonnées du patient')) + '</button>' +
        '</div>';
    }
  } else {
    // Formulaire de réponse
    html += '<div class="dwp-form">' +
      '<label class="dwp-check"><input type="checkbox" id="dispo-' + _esc(req.id) + '" checked> <span data-i18n="dw_ph_dispo">Médicament disponible</span></label>' +
      '<label class="dwp-check"><input type="checkbox" id="gen-' + _esc(req.id) + '"> <span data-i18n="dw_ph_generic_chk">J\'ai le générique</span></label>' +
      '<input class="form-control" id="meds-' + _esc(req.id) + '" maxlength="200" style="margin-bottom:8px" placeholder="' + _esc(_t('dw_ph_meds_ph','Préciser les médicaments disponibles (optionnel)')) + '" aria-label="' + _esc(_t('dw_ph_meds_ph','Préciser les médicaments disponibles (optionnel)')) + '">' +
      '<input class="form-control" id="com-' + _esc(req.id) + '" maxlength="300" placeholder="' + _esc(_t('dw_ph_comment_ph','Commentaire — ex : disponible demain matin (optionnel)')) + '" aria-label="' + _esc(_t('dw_ph_comment_ph','Commentaire — ex : disponible demain matin (optionnel)')) + '">' +
      '<div class="dwp-actions">' +
        '<button class="btn btn-primary" onclick="answer(\'' + _esc(req.id) + '\', true)"><i class="fa fa-check"></i> ' + _esc(_t('dw_ph_accept','Accepter')) + '</button>' +
        '<button class="btn btn-ghost" style="border:1.5px solid var(--red);color:var(--red)" onclick="answer(\'' + _esc(req.id) + '\', false)"><i class="fa fa-xmark"></i> ' + _esc(_t('dw_ph_refuse','Refuser')) + '</button>' +
      '</div>' +
    '</div>';
  }
  return html + '</article>';
}

async function showImage(reqId, path){
  var r = await window.tabibiDawini.getImageUrl(path);
  if (!r.ok){ toastM(window.tabibiDawini.errorMessage(r.error), 'error'); return; }
  state.imgUrls[reqId] = r.data;
  loadZone(true);
}

async function showContact(reqId){
  var box = document.getElementById('contact-' + reqId);
  var _prev = box.innerHTML;
  box.innerHTML = '<i class="fa fa-spinner fa-spin"></i> ' + _esc(_t('dw_loading','Chargement…'));
  var r = await window.tabibiDawini.getPatientContact(reqId);
  if (!r.ok){ box.innerHTML = _prev; toastM(window.tabibiDawini.errorMessage(r.error), 'error'); return; }
  box.innerHTML = '<i class="fa fa-user"></i> <b>' + _esc(r.data.nom) + '</b>' +
    (r.data.tel ? ' · <a href="tel:' + _esc(r.data.tel) + '" style="font-weight:700;color:var(--blue)"><i class="fa fa-phone"></i> ' + _esc(r.data.tel) + '</a>' : '');
}

async function answer(reqId, accepted){
  var meds = (document.getElementById('meds-' + reqId).value || '').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  // [DW-UX 2026-07-09] état de chargement sur le bouton cliqué
  var _card = document.getElementById('meds-' + reqId); _card = _card && _card.closest('.dwp-req');
  var _btns = _card ? _card.querySelectorAll('.dwp-actions button') : [];
  var _active = _card ? _card.querySelector('.dwp-actions button:' + (accepted ? 'first-child' : 'last-child')) : null;
  var _prev = _active ? _active.innerHTML : '';
  Array.prototype.forEach.call(_btns, function(b){ b.disabled = true; });
  if (_active) _active.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
  var r = await window.tabibiDawini.respond({
    requestId:   reqId,
    accepted:    accepted,
    disponible:  document.getElementById('dispo-' + reqId).checked,
    generique:   document.getElementById('gen-' + reqId).checked,
    medsDispo:   meds,
    commentaire: document.getElementById('com-' + reqId).value
  });
  if (!r.ok){
    Array.prototype.forEach.call(_btns, function(b){ b.disabled = false; });
    if (_active) _active.innerHTML = _prev;
    toastM(window.tabibiDawini.errorMessage(r.error), 'error'); return;
  }
  toastM(accepted ? _t('dw_ph_acc_ok','Réponse envoyée — le patient est prévenu.') : _t('dw_ph_ref_ok','Demande refusée.'), 'success');
  state.lastHash = null;  // force le re-render (l'état de la carte a changé)
  loadZone(true);
  loadStats();
}

// ── Chargements ──────────────────────────────────────────────────────────
async function loadZone(silent){
  var box = document.getElementById('dwp-list');
  if (!box.dataset.loaded && !silent){ box.innerHTML = '<div class="dw-loading"><i class="fa fa-spinner fa-spin"></i> ' + _esc(_t('dw_loading','Chargement…')) + '</div>'; }
  var r = await window.tabibiDawini.listZoneRequests();
  if (!r.ok){
    if (!silent) box.innerHTML = '<div class="dw-empty2"><div class="ic"><i class="fa fa-triangle-exclamation"></i></div><b>' + _esc(_t('dw_err_load','Impossible de charger les demandes')) + '</b><p>' + _esc(window.tabibiDawini.errorMessage(r.error)) + '</p><a onclick="loadZone()">' + _esc(_t('dw_retry','Réessayer')) + '</a></div>';
    return;
  }
  box.dataset.loaded = '1';
  var pending = r.data.filter(function(q){ return !q.my_response; });
  document.getElementById('dwp-dot').hidden = !pending.length;
  if (pending.length > state.lastCount && state.lastCount > 0){
    toastM(_t('dw_ph_new','Nouvelle demande Dawini !'), 'info');
  }
  state.lastCount = pending.length;
  // [FIX AUDIT 2026-07-09] le polling ne réécrit JAMAIS une saisie en cours :
  // (a) focus dans la liste, ou (b) un champ contient du texte → on diffère.
  if (silent){
    var act = document.activeElement;
    var typing = (act && box.contains(act) && /^(INPUT|TEXTAREA)$/.test(act.tagName));
    var hasText = Array.prototype.some.call(box.querySelectorAll('input[type="text"], textarea'), function(i){ return (i.value || '').trim(); });
    if (typing || hasText) return;
    // (c) données inchangées → pas de re-render (préserve aussi les cases cochées)
    var h = JSON.stringify(r.data.map(function(q){ return [q.id, q.status, (q.my_response || {}).id || null]; }));
    if (h === state.lastHash) return;
    state.lastHash = h;
  } else {
    state.lastHash = JSON.stringify(r.data.map(function(q){ return [q.id, q.status, (q.my_response || {}).id || null]; }));
  }
  box.innerHTML = r.data.length
    ? r.data.map(_reqCard).join('')
    : '<div class="dw-empty2"><div class="ic"><i class="fa fa-inbox"></i></div><b>' + _esc(_t('dw_ph_empty','Aucune demande dans votre wilaya pour l\'instant.')) + '</b><p>' + _esc(_t('dw_ph_empty_hint','Les nouvelles demandes des patients apparaissent ici en continu.')) + '</p></div>';
}

async function loadStats(){
  var r = await window.tabibiDawini.stats();
  if (!r.ok || !r.data) return;
  document.getElementById('kpi-total').textContent = r.data.zone_total || 0;
  document.getElementById('kpi-acc').textContent   = r.data.mine_accepted || 0;
  document.getElementById('kpi-ref').textContent   = r.data.mine_refused || 0;
}

// ── Init : session → fiche pharmacie → polling ───────────────────────────
async function init(){
  document.getElementById('loading').classList.add('hidden');
  var name = (window.tabibiDawini && window.tabibiDawini.featureName()) || 'Dawini';
  document.getElementById('dwp-page-title').textContent = name;
  document.title = name + ' — ' + _t('dw_ph_space','Espace pharmacie') + ' | Tabibi';

  // [DEMO DAWINI] en mode démo (tabibi-dawini-demo.js), pas de session requise
  if (!window.TABIBI_DAWINI_DEMO){
    var s = window.tabibi && window.tabibi.supabase;
    var session = null;
    try { session = s ? (await s.auth.getSession()).data.session : null; } catch(e){}
    if (!session){
      window.location = 'login.html?next=' + encodeURIComponent('/dawini-pharmacie.html');
      return;
    }
  }

  var ph = await window.tabibiDawini.myPharmacy();
  if (!ph.ok){
    document.getElementById('dwp-guard').hidden = false;
    return;
  }
  state.pharmacy = ph.data;
  document.getElementById('dwp-pharm-name').textContent = ph.data.nom;
  document.getElementById('dwp-main').hidden = false;

  window.tabibiDawini.expireOld();
  loadStats();
  // [DAWINI] Polling 20 s (décision fondateur — pas de Realtime v1)
  state.poller = window.tabibiDawini.startPolling(function(){ return loadZone(true); }, 20000);
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('tabibi:lang-change', function(){ loadZone(true); loadStats(); });
</script>
</body>
