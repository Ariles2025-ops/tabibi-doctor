<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<script src="js/tabibi-prelang.js"></script><script src="js/tabibi-rpc.js"></script>
<script src="js/tabibi-security.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="description" content="Rattachez votre compte Tabibi à votre fiche médecin.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F7560">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-192.png">
<title>Invitation médecin | Tabibi</title>
<link vite-ignore rel="preload" as="style" href="assets/vendor/fontawesome/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link vite-ignore rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css"></noscript>
<link rel="stylesheet" href="styles/tokens-v2.css">
<link rel="stylesheet" href="styles/components-v2.css">
<link rel="stylesheet" href="css/tabibi-ui.css">
<style>
  body { margin:0; background: var(--bg); color: var(--text); font-family: var(--font-family); }
  .inv-shell { max-width: 520px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r16);
              padding: 34px 26px; box-shadow: var(--s1); }
  .inv-ico { width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%;
             display: flex; align-items: center; justify-content: center; font-size: 38px; }
  .inv-ico.attente { background: var(--bg2); color: var(--text3); }
  .inv-ico.ok      { background: var(--color-success-light); color: var(--color-success-hover); }
  .inv-ico.err     { background: var(--color-danger-light); color: var(--color-danger); }
  .inv-titre { font-size: 21px; font-weight: 800; margin: 0 0 10px; line-height: 1.3; }
  .inv-texte { font-size: 14.5px; color: var(--text2); line-height: 1.65; margin: 0 0 22px; }
  .inv-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .inv-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px;
             border-radius: var(--r8); font-weight: 700; font-size: 14px; text-decoration: none;
             border: 0; cursor: pointer; font-family: inherit; }
  .inv-btn-p { background: var(--color-primary); color: #fff; }
  .inv-btn-s { background: var(--bg2); color: var(--text); border: 1px solid var(--border-strong); }
  .inv-note { margin-top: 18px; font-size: 12.5px; color: var(--text3); line-height: 1.6; }
</style>
</head>
<body>

<div class="inv-shell">
  <div class="inv-card">
    <div id="inv-ico" class="inv-ico attente"><i class="fa-solid fa-hourglass-half" aria-hidden="true"></i></div>
    <h1 id="inv-titre" class="inv-titre" data-i18n="inv_loading">Vérification de votre invitation…</h1>
    <p id="inv-texte" class="inv-texte" data-i18n="inv_loading_sub">Un instant.</p>
    <div id="inv-actions" class="inv-actions"></div>
    <p id="inv-note" class="inv-note"></p>
  </div>
</div>

<script src="assets/vendor/supabase/supabase-js-2.116.0.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/tabibi-features.js"></script>

<script>
/* =====================================================================
 * Rattacher un compte medecin a SA fiche — l'acceptation d'une invitation
 * =====================================================================
 * Le lien arrive par e-mail avec `?token=…`. Tout le travail se fait en base
 * (`accepter_invitation_medecin`) : cette page ne decide de rien, elle montre.
 *
 * ⚠️ LE JETON NE SORT PAS DE CETTE PAGE. Il n'est ni journalise, ni envoye a
 * Sentry, ni laisse dans l'URL apres usage : `history.replaceState` le retire
 * de la barre d'adresse des qu'il est consomme, pour qu'une capture d'ecran ou
 * un historique partage ne le promene pas.
 *
 * ⚠️ ET LA PAGE NE PROMET RIEN QU'ELLE N'AIT VU. Chaque ecran ci-dessous
 * correspond a une reponse REELLE de la RPC ; il n'y a pas d'ecran « succes »
 * atteignable sans `ok: true`. C'est la lecon du « e-mail envoye » de
 * `forgot-password.html` et du « 500+ » de la liste d'attente.
 * ===================================================================== */
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }
  function T(k, f) { return (typeof tabibiT === 'function') ? tabibiT(k, f) : f; }

  function rendre(etat, titre, texte, actions, note) {
    var ico = $('inv-ico');
    ico.className = 'inv-ico ' + etat;
    ico.innerHTML = '<i class="fa-solid fa-' + (
      etat === 'ok' ? 'circle-check' : etat === 'err' ? 'circle-exclamation' : 'hourglass-half'
    ) + '" aria-hidden="true"></i>';
    $('inv-titre').removeAttribute('data-i18n');
    $('inv-texte').removeAttribute('data-i18n');
    $('inv-titre').textContent = titre;
    $('inv-texte').textContent = texte;
    $('inv-actions').innerHTML = actions || '';
    $('inv-note').textContent = note || '';
  }

  // Les refus de la RPC, dits en francais. Un code machine affiche a un medecin
  // n'est pas un message : c'est l'aveu que personne n'a prevu le cas.
  var REFUS = {
    invalid_token:     ['inv_err_token',    "Ce lien d'invitation n'est pas valide. Vérifiez que vous avez copié l'adresse en entier."],
    expired:           ['inv_err_expired',  "Cette invitation a expiré. Demandez-nous un nouveau lien."],
    revoked:           ['inv_err_revoked',  "Cette invitation a été annulée. Contactez-nous si c'est une erreur."],
    already_accepted:  ['inv_err_taken',    "Cette invitation a déjà été utilisée par un autre compte."],
    already_claimed:   ['inv_err_claimed',  "Cette fiche est déjà rattachée à un compte."],
    email_mismatch:    ['inv_err_email',    "Ce lien a été envoyé à une autre adresse. Connectez-vous avec l'adresse qui a reçu l'invitation."],
    not_authenticated: ['inv_err_auth',     "Votre session a expiré. Reconnectez-vous, le lien restera valable."]
  };

  function texteRefus(code) {
    var e = REFUS[code];
    return e ? T(e[0], e[1]) : T('inv_err_generic', "Impossible de traiter cette invitation pour le moment.");
  }

  function lienConnexion() {
    var retour = encodeURIComponent(location.pathname + location.search);
    return '<a class="inv-btn inv-btn-p" href="/login.html?redirect=' + retour + '">'
         + '<i class="fa-solid fa-right-to-bracket"></i> ' + T('inv_login', 'Se connecter') + '</a>';
  }

  var LIEN_ACCUEIL = '<a class="inv-btn inv-btn-s" href="/accueil-public.html">'
    + '<i class="fa-solid fa-house"></i> Accueil</a>';

  async function principal() {
    var jeton = new URLSearchParams(location.search).get('token');
    if (!jeton || jeton.length < 32) {
      rendre('err', T('inv_bad_title', 'Lien incomplet'),
        T('inv_bad_sub', "Ce lien ne contient pas d'invitation valide. Ouvrez-le depuis l'e-mail que vous avez reçu."),
        LIEN_ACCUEIL);
      return;
    }

    var sb = window.tabibi && window.tabibi.supabase;
    if (!sb) {
      rendre('err', T('inv_svc_title', 'Service indisponible'),
        T('inv_svc_sub', "Impossible de joindre le service. Réessayez dans un instant."), LIEN_ACCUEIL);
      return;
    }

    // Connexion requise — et on le dit AVANT de consommer quoi que ce soit.
    var sess = await sb.auth.getSession();
    if (!sess || !sess.data || !sess.data.session) {
      rendre('attente', T('inv_auth_title', 'Connectez-vous pour continuer'),
        T('inv_auth_sub', "Cette invitation vous est nominative : connectez-vous avec l'adresse qui l'a reçue, puis revenez sur ce lien."),
        lienConnexion(),
        T('inv_auth_note', "Le lien reste valable après la connexion."));
      return;
    }

    if (typeof window.tabibiRpc !== 'function') {
      rendre('err', T('inv_svc_title', 'Service indisponible'),
        T('inv_svc_sub', "Impossible de joindre le service. Réessayez dans un instant."), LIEN_ACCUEIL);
      return;
    }

    var r = await window.tabibiRpc('accepter_invitation_medecin', { p_token: jeton });

    // Le jeton est consomme (ou refuse) : il n'a plus rien a faire dans l'URL.
    try {
      history.replaceState(null, '', location.pathname);
    } catch (e) { (window.tabibiErreur || console.warn)(e, 'invitation:replaceState'); }

    if (!r.ok) {
      console.warn('[invitation] refus :', r.erreur);
      rendre('err', T('inv_ko_title', "Invitation non acceptée"), texteRefus(r.erreur),
        (r.erreur === 'not_authenticated' ? lienConnexion() : '') + LIEN_ACCUEIL);
      return;
    }

    // ⚠️ `r.ok` de la passerelle dit que le TRANSPORT a reussi — pas que la base
    // a accepté. `tabibiRpc` normalise en `ok:false` quand la réponse porte un
    // `error`, mais une réponse qui ne porte NI `ok` NI `error` passe pour un
    // succès. Sans la ligne ci-dessous, cette page annonçait un rattachement
    // sur une réponse inattendue — un écran de succès atteignable sans que
    // rien n'ait été fait. Trouvé par son propre test e2e.
    if (!r.data || r.data.ok !== true) {
      console.warn('[invitation] réponse inattendue de la base :', r.data);
      rendre('err', T('inv_ko_title', "Invitation non acceptée"),
        T('inv_err_generic', "Impossible de traiter cette invitation pour le moment."),
        LIEN_ACCUEIL);
      return;
    }

    var deja = r.data && r.data.already_accepted;
    rendre('ok',
      deja ? T('inv_ok_again_title', 'Votre fiche est déjà rattachée')
           : T('inv_ok_title', 'Votre fiche est rattachée'),
      deja ? T('inv_ok_again_sub', "Ce lien avait déjà été utilisé par votre compte. Rien n'a changé.")
           : T('inv_ok_sub', "Votre compte est maintenant relié à votre fiche dans l'annuaire. Vous pouvez gérer vos horaires et vos rendez-vous."),
      '<a class="inv-btn inv-btn-p" href="/doctor-dashboard.html">'
        + '<i class="fa-solid fa-gauge"></i> ' + T('inv_go_dash', 'Mon espace médecin') + '</a>');
  }

  document.addEventListener('DOMContentLoaded', function () {
    principal().catch(function (e) {
      (window.tabibiErreur || console.error)(e, 'invitation:principal');
      rendre('err', T('inv_svc_title', 'Service indisponible'),
        T('inv_svc_sub', "Impossible de joindre le service. Réessayez dans un instant."), LIEN_ACCUEIL);
    });
  });
})();
</script>

<script src="js/tabibi-lang.js"></script>
<script src="js/tabibi-i18n.js"></script>
<script src="js/tabibi-langbar.js"></script>
</body>
</html>
