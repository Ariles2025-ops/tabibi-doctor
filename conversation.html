<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<script src="js/tabibi-prelang.js"></script><script src="js/tabibi-platform.js"></script><script src="js/tabibi-desktop-nav.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="description" content="Conversation Tabibi.">
<link rel="canonical" href="https://tabibi.doctor/conversation.html">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E5F46">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/icon-192.png">
<meta name="tabibi-page-key" content="title_messages">
<title>Conversation | Tabibi</title>
<link vite-ignore rel="preload" as="style" href="assets/vendor/fontawesome/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'"><noscript><link vite-ignore rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css"></noscript>
<link rel="stylesheet" href="styles/app.css">
<link rel="stylesheet" href="styles/components.css">
<!-- [UI 2026-07-09] Design system premium partagé (identité landing) -->
<link rel="stylesheet" href="css/tabibi-ui.css">
<style>
  .conv-wrap { display:flex; flex-direction:column; height:100dvh; max-width:640px; margin:0 auto; }
  #msg-list { flex:1; overflow-y:auto; padding:14px 16px; background:var(--bg, #f6f7f9); }
  .bubble { max-width:80%; padding:8px 12px; border-radius:14px; margin-bottom:8px; font-size:14px; line-height:1.4; overflow-wrap:break-word; white-space:pre-wrap; }
  .bubble.mine { margin-inline-start:auto; background:#0E5F46; color:#fff; border-end-end-radius:4px; }
  .bubble.theirs { margin-inline-end:auto; background:#fff; color:var(--text); border:1px solid var(--border); border-end-start-radius:4px; }
  .bubble .t { font-size:10px; opacity:.7; margin-top:3px; text-align:end; }
  .conv-empty { text-align:center; color:var(--text3); padding:48px 16px; font-size:14px; }
  .composer { display:flex; gap:8px; align-items:flex-end; padding:10px 12px; background:#fff; border-top:1px solid var(--border); }
  .composer textarea { flex:1; resize:none; border:1px solid var(--border); border-radius:18px; padding:9px 14px; font-size:14px; line-height:1.4; max-height:110px; font-family:inherit; }
  .composer button { width:42px; height:42px; flex-shrink:0; border:none; border-radius:50%; background:#0E5F46; color:#fff; font-size:16px; cursor:pointer; }
  .composer button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="conv-wrap">
<header class="app-bar">
  <button class="btn btn-icon btn-icon-sm btn-ghost" onclick="goBackSafe()" aria-label="Retour"><i class='fa fa-arrow-left'></i></button>
  <div class="app-bar-body"><div class="app-bar-title" id="conv-title">Conversation</div><div class="app-bar-sub" id="conv-sub" style="font-size:11px;color:var(--text3)"></div></div>
  <!-- [i18n] sélecteur de langue factorisé -->
  <div data-langbar></div>
</header>

<div id="msg-list" aria-live="polite"></div>

<div class="composer" id="composer">
  <textarea id="msg-input" rows="1" placeholder="Écrire un message…" data-i18n-placeholder="conv_input_ph" maxlength="4000"></textarea>
  <button id="msg-send" onclick="sendMsg()" aria-label="Envoyer"><i class="fa fa-paper-plane"></i></button>
</div>
</div>

<script>
// ========================================================================
// conversation.html — fil d'une conversation (?c=<uuid>).
// Polling 10s + mark-as-read a l'ouverture et a chaque poll. Pas de realtime.
// ========================================================================
// [CONFORMITE 2026] i18n dynamique : tabibiT (dico partagé, préfixe conv_*).
function _t(k, f){ return (typeof tabibiT === 'function') ? tabibiT(k, f) : f; }
var M;  // [MSG-fix] assigne au DOMContentLoaded : tabibi-messaging.js est charge en bas
        // de page, donc window.tabibiMessaging est undefined au parse de ce script inline.
var CONV_ID = new URLSearchParams(location.search).get('c') || '';

function _scrollBottom(){ var el = document.getElementById('msg-list'); if(el) el.scrollTop = el.scrollHeight; }

function _render(items){
  var box = document.getElementById('msg-list');
  if(!items || !items.length){
    box.innerHTML = '<div class="conv-empty">' + M.esc(_t('conv_empty','Aucun message. Démarrez la conversation ci-dessous.')) + '</div>';
    return;
  }
  box.innerHTML = items.map(function(m){
    return '<div class="bubble ' + (m.mine ? 'mine' : 'theirs') + '">' +
      M.esc(m.body) +
      '<div class="t">' + M.esc(M.fmtClock(m.created_at)) + '</div></div>';
  }).join('');
}

async function loadThread(scroll){
  if(!M || !CONV_ID) return;
  try {
    var items = await M.loadMessages(CONV_ID);
    _render(items);
    if(scroll) _scrollBottom();
    M.markRead(CONV_ID);                 // marque lus les messages recus
  } catch(e){ console.warn('[msg] thread', e && e.message); }
}

async function sendMsg(){
  if(!M || !CONV_ID) return;
  var input = document.getElementById('msg-input');
  var btn = document.getElementById('msg-send');
  var txt = (input.value || '').trim();
  if(!txt) return;
  btn.disabled = true;
  var r = await M.sendMessage(CONV_ID, txt);
  btn.disabled = false;
  if(r && r.error){ alert(_t('conv_send_failed','Envoi impossible : ') + r.error); return; }
  input.value = '';
  input.style.height = 'auto';
  await loadThread(true);
  input.focus();
}

function goBackSafe(){
  if(document.referrer){ history.back(); return; }
  location.href = 'messages.html';
}

var _poll = null;
function _startPoll(){ loadThread(false); if(_poll) clearInterval(_poll); _poll = setInterval(function(){ loadThread(false); }, 10000); }
function _stopPoll(){ if(_poll){ clearInterval(_poll); _poll = null; } }
document.addEventListener('visibilitychange', function(){ if(document.hidden) _stopPoll(); else _startPoll(); });

document.addEventListener('DOMContentLoaded', async function(){
  // [MSG] Backstop dark : flag OFF -> la page refuse de s'afficher (replace).
  if(!(window.TABIBI_FEATURES && window.TABIBI_FEATURES.messaging)){
    var _r=''; try{ _r=(JSON.parse(localStorage.getItem('tabibi_user')||'{}').role||''); }catch(e){}
    location.replace((_r==='medecin'||_r==='doctor') ? 'doctor-dashboard.html' : (_r==='patient' ? 'patient-dashboard.html' : 'index.html'));
    return;
  }
  M = window.tabibiMessaging;   // [MSG-fix] scripts charges -> window.tabibiMessaging dispo
  if(window.tabibi && window.tabibi.auth && window.tabibi.auth.requireAuth){
    var u = await window.tabibi.auth.requireAuth();
    if(!u) return;
  }
  if(!CONV_ID){ location.replace('messages.html'); return; }

  // En-tete : nom de l'autre participant.
  try {
    var c = await M.getConversation(CONV_ID);
    if(!c){
      document.getElementById('conv-title').textContent = _t('conv_not_found_title','Conversation introuvable');
      document.getElementById('composer').style.display = 'none';
      document.getElementById('msg-list').innerHTML = '<div class="conv-empty">' + M.esc(_t('conv_not_found_body',"Cette conversation n'existe pas ou ne vous est pas accessible.")) + '</div>';
      return;
    }
    document.getElementById('conv-title').textContent = c.name;
    document.getElementById('conv-sub').textContent = c.sub || '';
  } catch(e){ /* on continue : le fil reste accessible via RLS */ }

  // Auto-grow du textarea + envoi sur Entree (Shift+Entree = nouvelle ligne).
  var input = document.getElementById('msg-input');
  input.addEventListener('input', function(){ this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 110) + 'px'; });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
  });

  await loadThread(true);
  _startPoll();
});
// [CONFORMITE 2026] re-render du fil (empty state, horodatages) au changement de langue.
document.addEventListener('tabibi:lang-change', function(){ try { if(M && CONV_ID) loadThread(false); } catch(e){} });
window.sendMsg = sendMsg;
window.goBackSafe = goBackSafe;
</script>
<script src="assets/vendor/supabase/supabase-js-2.116.0.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>

<script src="js/tabibi-features.js"></script>
<script src="js/tabibi-messaging.js"></script>
<script src="js/tabibi-lang.js"></script>
<script src="js/tabibi-i18n.js"></script>
<!-- [i18n] sélecteur de langue + synchro bouton actif factorisés -->
<script src="js/tabibi-langbar.js"></script>
<!-- [Polish desktop] Sidebar pro partagée (visible ≥1024px uniquement) -->
<script src="js/tabibi-pro-sidebar.js"></script>
</body>
</html>
